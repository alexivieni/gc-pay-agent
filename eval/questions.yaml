  reference: PA 27.01
  source: pa-collective-agreement.html
  verified: false

- id: pa-08
  type: answer
  agreement: PA
  question: What is the weekend premium under the PA agreement?
  expected: An additional $2.25 per hour.
  article: "27"
  reference: PA 27.02(a)
  source: pa-collective-agreement.html
  verified: false

- id: pa-09
  type: answer
  agreement: PA
  question: Is the National Day for Truth and Reconciliation a designated paid holiday under the PA agreement?
  expected: Yes, it is listed as a designated paid holiday.
  article: "30"
  reference: PA 30.02
  source: pa-collective-agreement.html
  verified: false

- id: pa-10
  type: answer
  agreement: PA
  question: Under the PA agreement, how am I paid if I work on a designated paid holiday?
  expected: Time and one half (1.5x) for hours worked up to 7.5 hours and double time (2x) after that, in addition to the pay the employee would have received for the holiday.
  article: "30"
