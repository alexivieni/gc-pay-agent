- id: pa-11
  type: answer
  agreement: PA
  question: What are the normal hours of work for day workers under the PA agreement?
  expected: 37.5 hours per week, Monday to Friday, with a normal workday of 7.5 consecutive hours excluding an unpaid meal break.
  article: "25"
  reference: PA 25.06
  source: pa-collective-agreement.html
