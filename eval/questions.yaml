- id: pa-12
  type: answer
  agreement: PA
  question: Under the PA agreement, if I'm given paid time off for a religious obligation, do I have to make it up?
  expected: Yes, the hours with pay must be made up hour for hour within six months, and the make-up hours are not compensated.
  article: "31"
