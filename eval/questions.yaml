# Evaluation set for the GC Pay Agent.
#
# Each entry is one test question. Fields:
#   id         unique name
#   type       answer   = the agent should answer from the agreement
#              clarify  = the agent should ask which agreement/details apply
#              refuse   = the agreements don't cover it; the agent should say so
#   agreement  PA, EC or IT (answer questions only)
#   question   what gets sent to the agent
#   expected   the correct answer (answer), or the correct behaviour (clarify/refuse)
#   article    article number the answer must cite (answer questions only)
#   reference  clause to check it against
#   source     document the answer must cite (answer questions only)
#   verified   set to true once you've checked "expected" against the agreement
#
# These answers were drafted from the published agreement text and still need
# checking. For each one: open the clause in "reference", confirm or correct
# "expected", then set verified: true.

# ---------------------------------------------------------------------------
# PA: Program and Administrative Services
# ---------------------------------------------------------------------------

- id: pa-01
  type: answer
  agreement: PA
  question: Under the PA agreement, what is the overtime rate for overtime worked on a scheduled workday?
  expected: Time and one half (1.5x) for the first 7.5 consecutive hours of overtime, and double time (2x) after that.
  article: "28"
  reference: PA 28.05(a)
  source: pa-collective-agreement.html
  verified: false

- id: pa-02
  type: answer
  agreement: PA
  question: Under the PA agreement, how am I paid for working on my first day of rest?
  expected: Time and one half (1.5x) for the first 7.5 hours, and double time (2x) after that.
  article: "28"
  reference: PA 28.06(a)
  source: pa-collective-agreement.html
  verified: false

- id: pa-03
  type: answer
  agreement: PA
  question: Under the PA agreement, what is the overtime rate for work on a second or subsequent day of rest?
  expected: Double time (2x).
  article: "28"
  reference: PA 28.06(b)
  source: pa-collective-agreement.html
  verified: false

- id: pa-04
  type: answer
  agreement: PA
  question: Under the PA agreement, what is the minimum I'm paid if I'm called back to work after my shift?
  expected: The equivalent of 3 hours' pay at the applicable overtime rate for each call-back, up to a maximum of 8 hours' compensation in an 8-hour period.
  article: "28"
  reference: PA 28.05(c)(i)
  source: pa-collective-agreement.html
  verified: false

- id: pa-05
  type: answer
  agreement: PA
  question: Under the PA agreement, how much is the meal allowance when I work overtime?
  expected: Reimbursement of $12 for one meal when working three or more hours of overtime (unless free meals are provided).
  article: "28"
  reference: PA 28.09(a)
  source: pa-collective-agreement.html
  verified: false

- id: pa-06
  type: answer
  agreement: PA
  question: Under the PA agreement, how is standby time compensated?
  expected: Half an hour (0.5 hours) of pay for each 4-hour period, or part of a period, on standby.
  article: "29"
  reference: PA 29.01
  source: pa-collective-agreement.html
  verified: false

- id: pa-07
  type: answer
  agreement: PA
  question: What is the shift premium under the PA agreement?
  expected: $2.25 per hour.
