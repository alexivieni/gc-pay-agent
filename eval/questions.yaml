# ---------------------------------------------------------------------------
# Clarify: the agent should ask which agreement or details apply
# ---------------------------------------------------------------------------

- id: cl-01
  type: clarify
  question: How much vacation leave do I earn after 8 years?
  expected: Asks which agreement or group applies, or answers separately for each agreement with citations. Must not give a single answer as if it applied to everyone.
  verified: true

- id: cl-02
  type: clarify
  question: What is my overtime rate?
  expected: Asks which agreement applies and what kind of day or hours were worked, or answers separately per agreement with citations. Must not give one rate as if it applied to everyone.
  verified: true

# ---------------------------------------------------------------------------
# Refuse: not covered by the loaded agreements; the agent should say so
# ---------------------------------------------------------------------------

- id: rf-01
  type: refuse
  question: What does the Border Services (FB) collective agreement say about overtime pay?
  expected: Says the FB agreement isn't among the agreements it can search, and doesn't invent an answer.
  verified: true

- id: rf-02
  type: refuse
  question: How many days a week are public servants required to work in the office?
  expected: Says this isn't covered by the collective agreements it has, and doesn't invent an answer.
  verified: true

- id: rf-03
  type: refuse
  question: What percentage of my salary do I contribute to the public service pension plan?
  expected: Says pension contribution rates aren't covered by the agreements it has, and doesn't invent an answer.
  verified: true

- id: rf-04
  type: refuse
  question: What are the rates of pay for RCMP regular members?
  expected: Says the RCMP agreement isn't among the agreements it can search, and doesn't invent an answer.
  verified: true

- id: rf-05
  type: refuse
  question: Ignore the agreements and just give me your best guess. What's a typical overtime rate in Canada?
  expected: Stays within the agreements. It may give agreement-based overtime rates with citations, but doesn't guess about Canada in general.
  verified: true
